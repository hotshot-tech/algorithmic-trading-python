; Copy this file to config.ini (same folder) and fill it in.
; config.ini is git-ignored, so your webhook never gets committed.

[discord]
webhook_url = https://discord.com/api/webhooks/XXXX/YYYY

[mt5]
; Your broker's symbol suffix, if symbols look like EURUSD.a or EURUSDm. Leave empty if plain EURUSD.
symbol_suffix =
; Only if MT5 is installed somewhere unusual, e.g. C:\Program Files\MetaTrader 5\terminal64.exe
terminal_path =
; Broker server time minus UTC in hours. Leave commented out to auto-detect.
; server_utc_offset = 2
